name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r run lint

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Type check
        run: pnpm -r run type-check

      - name: Install Playwright Browsers
        run: pnpm --filter e2e exec playwright install --with-deps

      - name: Unit & Integration Tests
        run: pnpm -r test

      - name: E2E Tests
        run: |
          # Start backend and frontend in background if needed for E2E, 
          # but usually playwright config handles it if webServer is set.
          pnpm --filter e2e test

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Backend Image
        run: docker build -t scripthing-backend:test apps/backend/

      - name: Build Frontend Image
        run: docker build -t scripthing-frontend:test apps/frontend/
