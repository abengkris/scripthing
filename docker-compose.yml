version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
    environment:
      - DATABASE_URL=file:./data/scripthing.db
      - APP_SECRET=${APP_SECRET}
      - FRONTEND_URL=http://localhost
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
